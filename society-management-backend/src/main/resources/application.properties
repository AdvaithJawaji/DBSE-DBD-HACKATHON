spring.application.name=Resident360

# ─── Server ───────────────────────────────────────────
server.port=8080

# ─── MySQL DataSource ─────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/society_management?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
